<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Panorama P1 debug view</title>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font-family: monospace; }
  #feed { display: block; max-width: 100vw; }

  #simulator { padding: 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; font-family: sans-serif; }

  /* --- the mocked-up device screen -------------------------------- */
  #screen-wrap { flex: 0 0 auto; }
  #screen {
    width: 320px; height: 240px; background: #05070a; border: 3px solid #444;
    border-radius: 4px; overflow: hidden; display: flex; flex-direction: column;
    font-family: monospace; box-shadow: 0 0 12px rgba(0,0,0,.6);
  }
  #bigfont-row { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 6px; background: #05070a; }
  #bigfont { font-size: 15px; font-weight: bold; color: #fff; letter-spacing: 1px; }
  #paramval { font-size: 12px; color: #9a9a9a; } /* displayId 3, paired with bigfont */
  #pagelabels { font-size: 9px; color: #6a8; padding: 0 6px 2px; background: #05070a; min-height: 11px; } /* displayId 5 */
  #titlebar { display: flex; height: 20px; }
  #titlebar .seg {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold; color: #fff; overflow: hidden; white-space: nowrap;
  }
  #titlebar .seg.on { background: #c0392b; }
  #titlebar .seg.off { background: #333; }
  #content { flex: 1; padding: 6px; overflow: hidden; }

  /* knob layout */
  .knob-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 4px; height: 100%; align-content: center; }
  .knob { text-align: center; font-size: 9px; }
  .knob .dial { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ccc 60%, #999); margin: 0 auto 3px; position: relative; }
  .knob .dial::after { content: ''; position: absolute; top: 3px; left: 50%; width: 2px; height: 8px; background: #333; transform: translateX(-50%) rotate(20deg); transform-origin: bottom; }
  .knob .val { color: #9a9a9a; }
  .knob .name { color: #fff; }

  /* fader layout */
  .fader-row { display: flex; height: 100%; align-items: flex-end; gap: 4px; padding-bottom: 4px; }
  .fader-row.split { gap: 10px; }
  .fader-row.split .fader-group { display: flex; gap: 4px; }
  .fader { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 9px; }
  .fader .bar-track { width: 14px; height: 90px; background: #14202c; border: 1px solid #345; display: flex; align-items: flex-end; }
  .fader .bar-fill { width: 100%; background: #eee; }
  .fader .name { color: #fff; margin-top: 3px; }

  /* pad grid layout */
  .pad-grid { display: grid; grid-template-columns: 16px repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 3px; height: 100%; }
  .pad-row-label { display: flex; align-items: center; justify-content: center; color: #9a9a9a; font-size: 10px; }
  .pad { background: #123047; border: 1px solid #2a4a68; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
  .pad.empty { background: #0d1b28; }
  .pad.lit { background: #7a1f2b; border-color: #c0392b; } /* displayId 0 (pad_state) != 0 -- confirmed red/pink tint, Twenty-fifth finding */

  /* displayId 8 popup menu -- ALWAYS overlays on top of whatever's showing, real device renders it as
     a box on the right side of the screen (Twenty-sixth/Twenty-seventh findings) */
  #popup-menu {
    position: absolute; top: 22px; right: 4px; bottom: 22px; width: 44%;
    background: rgba(5,10,20,.94); border: 1px solid #345; display: flex; flex-direction: column;
    font-size: 9px; overflow: hidden;
  }
  #popup-menu .item { padding: 2px 4px; color: #fff; border-bottom: 1px solid #1a2a38; }
  #popup-menu .item.hl { background: #c0392b; } /* CC 111 = selectedMenuItem */
  #screen { position: relative; }

  /* pageTemplate=1 "message" overlay (writeMessageToDisplay) -- a separate, special rendering
     pathway, not composable with the other templates/chrome (see protocol notes) -- so on the mockup
     it's drawn as a full-screen takeover, same as it visually is on real hardware. */
  #message-overlay {
    position: absolute; inset: 0; background: #05070a; color: #fff; font-weight: bold;
    font-size: 16px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 10px; box-sizing: border-box; white-space: pre-wrap;
  }

  /* list layout */
  .list-layout { display: flex; height: 100%; gap: 8px; }
  .list-layout .fader { flex: 0 0 20px; }
  .list-items { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .list-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #fff; }
  .list-item .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #9a9a9a; }

  #tabs { display: flex; height: 22px; }
  #tabs .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; }
  #tabs .tab.on { background: #c0392b; }
  #tabs .tab.off { background: #333; }

  /* --- controls ----------------------------------------------------- */
  #controls { flex: 1; min-width: 280px; max-width: 480px; }
  #controls h3 { margin: 0 0 6px; font-size: 13px; color: #9cf; }
  #controls fieldset { border: 1px solid #444; border-radius: 4px; margin-bottom: 10px; padding: 8px; }
  #controls label { display: block; font-size: 11px; margin: 4px 0 2px; color: #aaa; }
  #controls input[type=text] { width: 100%; box-sizing: border-box; background: #222; color: #eee; border: 1px solid #444; padding: 3px 5px; font-family: monospace; }
  #controls select { background: #222; color: #eee; border: 1px solid #444; padding: 3px; }
  .row { display: flex; gap: 6px; }
  .row > div { flex: 1; }
  #note { font-size: 11px; color: #888; margin-top: 10px; max-width: 480px; }

  #led-panel { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .led-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; color: #aaa; width: 36px; }
  .led-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #555; background: #222; cursor: pointer; padding: 0; }
  .led-dot.on { background: #e0a030; border-color: #ffc060; box-shadow: 0 0 6px #e0a030; } /* color unconfirmed on hardware -- on/off only is confirmed, hue is a placeholder */
</style>
</head>
<body>
<img id="feed" src="/stream.mjpg">

<div id="simulator">
  <div id="screen-wrap">
    <div id="screen">
      <div id="bigfont-row">
        <div id="bigfont"></div>
        <div id="paramval"></div>
      </div>
      <div id="pagelabels"></div>
      <div id="titlebar"></div>
      <div id="content"></div>
      <div id="tabs"></div>
      <div id="popup-menu" hidden></div>
      <div id="message-overlay" hidden></div>
    </div>
  </div>

  <div id="controls">
    <h3>Panorama P1 screen simulator</h3>
    <div id="note">Full field docs: research/panorama-p1-protocol-notes.md, protocol.json</div>

    <fieldset>
      <label>page_template</label>
      <select id="in-layout">
        <option value="knobs">16/17 mixer</option>
        <option value="faders-split">18 instrument_layer_container</option>
        <option value="faders-row">19/20 faders_row</option>
        <option value="pads16">21 drum_pads</option>
        <option value="pads12">22 drum_pads_3row</option>
        <option value="list">4 list</option>
        <option value="grid5">5 grid5</option>
        <option value="message">1 message</option>
        <option value="menu">2 menu</option>
        <option value="transport-launcher">3 transport_launcher</option>
        <option value="list-highlighted">6 list_highlighted</option>
        <option value="scene-buttons">7 scene_buttons</option>
        <option value="browser-list">8/9 browser_list</option>
        <option value="reset">0 reset</option>
      </select>
    </fieldset>

    <fieldset>
      <label>message (pageTemplate 1)</label>
      <input type="text" id="in-message-overlay" value="" maxlength="127">
    </fieldset>

    <fieldset>
      <label>displayId 2 -- big_font</label>
      <input type="text" id="in-bigfont" value="" maxlength="30">
      <label>displayId 3 -- current_value</label>
      <input type="text" id="in-current-value" value="" maxlength="16">
    </fieldset>

    <fieldset>
      <label>displayId 1 -- title_bar</label>
      <div class="row">
        <div><input type="text" id="in-tb1" value="" maxlength="12"></div>
        <div><input type="text" id="in-tb2" value="" maxlength="12"></div>
        <div><input type="text" id="in-tb3" value="" maxlength="12"></div>
      </div>
    </fieldset>

    <fieldset>
      <label>displayId 5 -- page_labels</label>
      <input type="text" id="in-pagelabels" value="">
    </fieldset>

    <fieldset>
      <label>displayId 6 -- ctrl_element_name</label>
      <input type="text" id="in-names" value="">
      <label>displayId 7 -- ctrl_element_value</label>
      <input type="text" id="in-values" value="">
    </fieldset>

    <fieldset>
      <label>displayId 0 -- pad_state</label>
      <input type="text" id="in-padstate" value="">
    </fieldset>

    <fieldset>
      <label>displayId 4 -- menu_button</label>
      <div class="row">
        <div style="flex:3"><input type="text" id="in-tabs" value=""></div>
        <div style="flex:1"><input type="text" id="in-tabs-active" value="0"></div>
      </div>
    </fieldset>

    <fieldset>
      <label>displayId 8 -- page_menu</label>
      <input type="text" id="in-menuitems" value="">
      <label>CC 111 -- selectedMenuItem</label>
      <input type="text" id="in-menuhighlight" value="">
    </fieldset>

    <fieldset>
      <label>LEDs (CC, on/off)</label>
      <div id="led-panel"></div>
    </fieldset>

    <div id="push-status" style="font-size:11px; color:#888; margin-bottom:6px;">not yet pushed</div>
    <button id="full-sync-btn" type="button" style="margin-bottom:10px;">Send full state (bypass diff)</button>
  </div>
</div>

<script>
function el(id) { return document.getElementById(id); }
function csv(s) { return s.split(',').map(x => x.trim()); }

// See lib.rs's LED_CCS -- kept in sync by hand, same 18 CCs, same order.
const LED_DEFS = [
  [16, 'Sel1'], [17, 'Sel2'], [18, 'Sel3'], [19, 'Sel4'], [20, 'Sel5'], [21, 'Sel6'], [22, 'Sel7'], [23, 'Sel8'],
  [106, 'Menu1'], [107, 'Menu2'], [108, 'Menu3'], [109, 'Menu4'], [110, 'Menu5'],
  [80, 'Loop'], [84, 'Play'], [85, 'Record'], [29, 'AutoWr'], [99, 'FKeys'],
];

function buildLedPanel() {
  const panel = el('led-panel');
  panel.innerHTML = '';
  LED_DEFS.forEach(([cc, label]) => {
    const item = document.createElement('div');
    item.className = 'led-item';
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'led-dot';
    dot.dataset.cc = cc;
    dot.title = `CC ${cc}`;
    dot.addEventListener('click', () => { dot.classList.toggle('on'); pushToDevice(); });
    const lbl = document.createElement('div');
    lbl.textContent = label;
    item.appendChild(dot);
    item.appendChild(lbl);
    panel.appendChild(item);
  });
}
buildLedPanel();

function ledsOnList() {
  return [...document.querySelectorAll('.led-dot.on')].map(d => parseInt(d.dataset.cc, 10));
}

function renderTitleBar() {
  const segs = [el('in-tb1').value, el('in-tb2').value, el('in-tb3').value];
  const bar = el('titlebar');
  bar.innerHTML = '';
  segs.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'seg ' + (i === 2 ? 'on' : 'off'); // rightmost segment red in observed photos
    d.textContent = s;
    bar.appendChild(d);
  });
}

function renderTabs() {
  const names = csv(el('in-tabs').value);
  const active = parseInt(el('in-tabs-active').value, 10) || 0;
  const bar = el('tabs');
  bar.innerHTML = '';
  names.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'tab ' + (i === active ? 'on' : 'off');
    d.textContent = s;
    bar.appendChild(d);
  });
}

function fader(name, pct) {
  const w = document.createElement('div');
  w.className = 'fader';
  w.innerHTML = `<div class="bar-track"><div class="bar-fill" style="height:${pct}%"></div></div><div class="name">${name}</div>`;
  return w;
}

function padStateList() {
  const raw = el('in-padstate').value.trim();
  if (!raw) return [];
  return raw.split(',').map(x => parseInt(x.trim(), 10) || 0);
}

function renderContent() {
  const layout = el('in-layout').value;
  const names = csv(el('in-names').value);
  const values = csv(el('in-values').value);
  const padState = padStateList();
  const content = el('content');
  content.innerHTML = '';

  if (layout === 'knobs') {
    const grid = document.createElement('div');
    grid.className = 'knob-grid';
    for (let i = 0; i < 8; i++) {
      const k = document.createElement('div');
      k.className = 'knob';
      k.innerHTML = `<div class="val">${values[i] || ''}</div><div class="dial"></div><div class="name">${names[i] || ''}</div>`;
      grid.appendChild(k);
    }
    content.appendChild(grid);
  } else if (layout === 'faders-split') {
    // Template 18 confirmed to use all 16 ctrlElementName slots, not 8: each of
    // the 8 fader bars shows TWO stacked labels. Left group of 4 stacks
    // names[0-3] (top) over names[4-7] (bottom); right group of 4 stacks
    // names[8-11] (top) over names[12-15] (bottom) -- see "Follow-up on
    // template 18: it actually has 16 name slots, not 8" in the protocol notes.
    const row = document.createElement('div');
    row.className = 'fader-row split';
    const g1 = document.createElement('div'); g1.className = 'fader-group';
    const g2 = document.createElement('div'); g2.className = 'fader-group';
    for (let i = 0; i < 4; i++) g1.appendChild(fader(`${names[i] || ''}/${names[i + 4] || ''}`, 40 + i * 8));
    for (let i = 0; i < 4; i++) g2.appendChild(fader(`${names[i + 8] || ''}/${names[i + 12] || ''}`, 40 + i * 8));
    row.appendChild(g1); row.appendChild(g2);
    content.appendChild(row);
  } else if (layout === 'faders-row') {
    // Templates 19/20: one continuous row of 8, single label per fader (16-slot
    // stacking was never confirmed here -- that's specific to template 18).
    const row = document.createElement('div');
    row.className = 'fader-row';
    for (let i = 0; i < 8; i++) row.appendChild(fader(names[i] || '', 40 + (i % 4) * 8));
    content.appendChild(row);
  } else if (layout === 'pads16' || layout === 'pads12') {
    // Template 21 (pads16): full 4x4 grid, rows A-D, all 16 pads individually
    // labeled. Template 22 (pads12): confirmed genuinely distinct (Sixteenth
    // finding), a 3x4 grid, rows A-C only -- there is no 4th row at all, not
    // just an unlabeled one. names[12-15] are ignored for pads12 since the
    // device itself never renders a 4th row for that template.
    const nrows = layout === 'pads16' ? 4 : 3;
    const grid = document.createElement('div');
    grid.className = 'pad-grid';
    grid.style.gridTemplateRows = `repeat(${nrows}, 1fr)`;
    const rows = (layout === 'pads16' ? ['D', 'C', 'B', 'A'] : ['C', 'B', 'A']);
    for (let r = 0; r < nrows; r++) {
      const lbl = document.createElement('div');
      lbl.className = 'pad-row-label';
      lbl.textContent = rows[r];
      grid.appendChild(lbl);
      for (let c = 0; c < 4; c++) {
        const idx = (nrows - 1 - r) * 4 + c; // row A = indices 0-3, row B = 4-7, etc.
        const pad = document.createElement('div');
        const label = names[idx];
        const lit = (padState[idx] || 0) !== 0; // displayId 0 -- confirmed red/pink tint, Twenty-fifth finding
        pad.className = 'pad' + (label ? '' : ' empty') + (lit ? ' lit' : '');
        pad.textContent = label || '';
        grid.appendChild(pad);
      }
    }
    content.appendChild(grid);
  } else if (layout === 'list') {
    const wrap = document.createElement('div');
    wrap.className = 'list-layout';
    wrap.appendChild(fader('', 55));
    const items = document.createElement('div');
    items.className = 'list-items';
    names.slice(0, 8).forEach(n => {
      const it = document.createElement('div');
      it.className = 'list-item';
      it.innerHTML = `<div class="dot"></div><div>${n}</div>`;
      items.appendChild(it);
    });
    wrap.appendChild(items);
    content.appendChild(wrap);
  } else if (layout === 'grid5') {
    const grid = document.createElement('div');
    grid.className = 'pad-grid';
    grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
    grid.style.gridTemplateRows = 'repeat(2, 1fr)';
    for (let i = 0; i < 8; i++) {
      const pad = document.createElement('div');
      pad.className = 'pad';
      pad.textContent = names[i] || '';
      grid.appendChild(pad);
    }
    content.appendChild(grid);
  } else {
    // No bespoke mock widget built yet for this template (message/menu/
    // transport-launcher/list-highlighted/scene-buttons/browser-list) --
    // fall back to a plain field dump rather than pretending to know the
    // real layout. The actual SysEx write over the WebSocket is unaffected;
    // this only concerns the on-screen mockup.
    const dump = document.createElement('div');
    dump.style.cssText = 'font-size:10px; color:#9a9a9a; line-height:1.5;';
    dump.innerHTML = `<div style="color:#666;">(no mock widget for this template yet -- names/values shown raw)</div>` +
      `names: ${names.filter(Boolean).join(', ') || '(none)'}<br>values: ${values.filter(Boolean).join(', ') || '(none)'}`;
    content.appendChild(dump);
  }
}

function renderPopupMenu() {
  const items = csv(el('in-menuitems').value).filter(Boolean);
  const box = el('popup-menu');
  if (items.length === 0) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  const hl = parseInt(el('in-menuhighlight').value, 10) || 0; // 1-based, CC 111
  box.innerHTML = '';
  items.slice(0, 8).forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'item' + (i + 1 === hl ? ' hl' : '');
    row.textContent = s;
    box.appendChild(row);
  });
}

function renderSimulator() {
  el('bigfont').textContent = el('in-bigfont').value;
  el('paramval').textContent = el('in-current-value').value; // displayId 3
  el('pagelabels').textContent = csv(el('in-pagelabels').value).filter(Boolean).join('  |  '); // displayId 5
  renderTitleBar();
  renderContent();
  renderTabs();
  renderPopupMenu(); // displayId 8 -- ALWAYS an overlay, drawn last, independent of layout/template

  // pageTemplate=1 message overlay -- a separate rendering pathway on real
  // hardware, so it takes over the whole mock screen the same way, hiding
  // everything else drawn above rather than compositing with it.
  const msg = el('in-message-overlay').value;
  const overlay = el('message-overlay');
  overlay.hidden = !msg;
  overlay.textContent = msg;
}

// Bidirectional, but NOT via this page's own HTTP server: the browser talks
// directly to prototypes/panorama-p1/src/bin/service.rs, the one persistent
// process that actually holds the connection to the device (see that file's
// doc comment). This server (server.py) has no involvement in this at all --
// it only serves the webcam feed and this static page. Every edit pushes
// over the same open WebSocket (debounced, so a fast typist doesn't flood
// it with a SysEx write per keystroke); the service also sends this tab
// whatever the last known state was, right when the socket opens, so a
// second tab (or a reload) starts in sync rather than from stale defaults.
const WS_PORT = 8091;
let ws = null;
let wsReady = false;

function connectService() {
  ws = new WebSocket(`ws://${location.hostname}:${WS_PORT}`);
  const status = el('push-status');
  ws.addEventListener('open', () => {
    wsReady = true;
    status.textContent = 'connected to service ✓';
    status.style.color = '#7fd07f';
  });
  ws.addEventListener('close', () => {
    wsReady = false;
    status.textContent = 'service disconnected, retrying...';
    status.style.color = '#e08080';
    setTimeout(connectService, 1500);
  });
  ws.addEventListener('error', () => ws.close());
  ws.addEventListener('message', (ev) => {
    try {
      applyScreenPush(JSON.parse(ev.data));
    } catch (e) { /* ignore malformed */ }
  });
}
connectService();

// Differential push: the device keeps per-field state (see "Thirteenth
// finding" in the protocol notes), so we track what we last actually sent
// and only send a message for a field whose current form value differs from
// that -- editing the title bar never re-sends names/values/tabs, and vice
// versa. `layout` (page template) gets special handling: switching it is
// confirmed to clear per-template content fields (names/values/bigfont/tabs)
// on the device regardless of whether the switching message touches them,
// while the title bar is "global chrome" that survives the switch -- so a
// template-only change is carried on a title-bar write (the one field safe
// to resend unconditionally) and nothing else, and our bookkeeping for the
// content fields is invalidated (not resent) so the *next* edit to any of
// them is treated as a real change instead of being skipped as "unchanged".
let lastSent = {
  layout: null, bigfont: null, titleBar: null, names: null, values: null, tabs: null,
  currentValue: null, pageLabels: null, padState: null, menuItems: null, menuHighlight: null,
  message: null, ledsOn: null,
};

function arraysEqual(a, b) {
  if (!a || !b) return a === b;
  if (a.length !== b.length) return false;
  return a.every((v, i) => v === b[i]);
}

function currentState() {
  return {
    layout: el('in-layout').value,
    bigfont: el('in-bigfont').value,
    titleBar: [el('in-tb1').value, el('in-tb2').value, el('in-tb3').value],
    names: csv(el('in-names').value),
    values: csv(el('in-values').value),
    tabs: csv(el('in-tabs').value),
    // Added so every displayId is independently addressable, orthogonal to
    // `layout` -- see the note fieldset in the controls panel.
    currentValue: el('in-current-value').value,
    pageLabels: csv(el('in-pagelabels').value),
    padState: padStateList(),
    menuItems: csv(el('in-menuitems').value).filter(Boolean),
    menuHighlight: parseInt(el('in-menuhighlight').value, 10) || 0,
    message: el('in-message-overlay').value,
    ledsOn: ledsOnList(),
  };
}

function sendField(layout, fields) {
  if (!wsReady) return;
  ws.send(JSON.stringify(Object.assign({ layout }, fields)));
}

let pushTimer = null;
function pushToDevice() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    if (!wsReady) return; // status line already shows "disconnected"
    const cur = currentState();
    const layoutKnown = lastSent.layout !== null;
    const layoutChanged = layoutKnown && cur.layout !== lastSent.layout;

    if (layoutChanged) {
      sendField(cur.layout, { titleBar: cur.titleBar });
      lastSent = {
        layout: cur.layout, titleBar: cur.titleBar, bigfont: null, names: null, values: null, tabs: null,
        currentValue: null, pageLabels: null, padState: null, menuItems: lastSent.menuItems, menuHighlight: lastSent.menuHighlight,
        message: lastSent.message, ledsOn: lastSent.ledsOn,
      };
      return;
    }
    if (!layoutKnown) lastSent.layout = cur.layout; // first push ever: adopt silently, no switch to carry

    if (!arraysEqual(cur.titleBar, lastSent.titleBar)) {
      sendField(cur.layout, { titleBar: cur.titleBar });
      lastSent.titleBar = cur.titleBar;
    }
    if (cur.bigfont !== lastSent.bigfont) {
      sendField(cur.layout, { bigfont: cur.bigfont });
      lastSent.bigfont = cur.bigfont;
    }
    if (!arraysEqual(cur.names, lastSent.names)) {
      sendField(cur.layout, { names: cur.names });
      lastSent.names = cur.names;
    }
    if (!arraysEqual(cur.values, lastSent.values)) {
      sendField(cur.layout, { values: cur.values });
      lastSent.values = cur.values;
    }
    if (!arraysEqual(cur.tabs, lastSent.tabs)) {
      sendField(cur.layout, { tabs: cur.tabs });
      lastSent.tabs = cur.tabs;
    }
    if (cur.currentValue !== lastSent.currentValue) {
      sendField(cur.layout, { currentValue: cur.currentValue });
      lastSent.currentValue = cur.currentValue;
    }
    if (!arraysEqual(cur.pageLabels, lastSent.pageLabels)) {
      sendField(cur.layout, { pageLabels: cur.pageLabels });
      lastSent.pageLabels = cur.pageLabels;
    }
    if (!arraysEqual(cur.padState, lastSent.padState)) {
      sendField(cur.layout, { padState: cur.padState });
      lastSent.padState = cur.padState;
    }
    // Popup menu (displayId 8) and its CC-111 highlight always target
    // page_template=0 on the real device regardless of `cur.layout` -- sent
    // the same way (via sendField) since the service ignores `layout` for
    // these two fields anyway (see service.rs's apply()).
    if (!arraysEqual(cur.menuItems, lastSent.menuItems)) {
      sendField(cur.layout, { menuItems: cur.menuItems });
      lastSent.menuItems = cur.menuItems;
    }
    if (cur.menuHighlight !== lastSent.menuHighlight) {
      sendField(cur.layout, { menuHighlight: cur.menuHighlight });
      lastSent.menuHighlight = cur.menuHighlight;
    }
    // The message overlay (pageTemplate=1) is its own rendering pathway,
    // independent of `cur.layout` too -- write_message() on the service side
    // hardcodes its own page_template, same as the popup menu does.
    if (cur.message !== lastSent.message) {
      sendField(cur.layout, { message: cur.message });
      lastSent.message = cur.message;
    }
    // LEDs are plain CC feedback, unrelated to page_template entirely.
    if (!arraysEqual(cur.ledsOn, lastSent.ledsOn)) {
      sendField(cur.layout, { ledsOn: cur.ledsOn });
      lastSent.ledsOn = cur.ledsOn;
    }
  }, 350);
}

document.querySelectorAll('#controls input, #controls select').forEach(i => {
  i.addEventListener('input', () => { renderSimulator(); pushToDevice(); });
});

// Full-state transmission is a distinct, deliberately-available path, not
// just an implicit side effect of the differential logic above: one
// WebSocket frame carrying every field, applied by service.rs in one shot
// regardless of what the device last held. Useful as a known-good baseline
// (e.g. before/between isolated tests) and as a manual "resync" if this
// tab's diff bookkeeping and the device's actual state have drifted apart
// for any reason (dropped message, another client's write we didn't see, a
// device power cycle). Bypasses the debounce timer too -- sends immediately.
function sendFullState() {
  clearTimeout(pushTimer);
  const cur = currentState();
  if (!wsReady) return;
  ws.send(JSON.stringify(cur));
  lastSent = Object.assign({}, cur);
}
el('full-sync-btn').addEventListener('click', sendFullState);

renderSimulator();
</script>

<script>
// applyScreenPush is also called from the WebSocket 'message' handler above
// (connectService()) -- that's how this mockup stays in sync with the real
// device's last-known state from ANY client, not just this tab's own edits.
let knownHtmlMtime = null;

function applyScreenPush(push) {
  if (!push) return;
  // Don't stomp on an in-progress edit in this tab.
  if (document.activeElement && document.activeElement.closest('#controls')) return;
  if (push.layout !== undefined) el('in-layout').value = push.layout;
  if (push.bigfont !== undefined) el('in-bigfont').value = push.bigfont;
  if (push.titleBar) {
    el('in-tb1').value = push.titleBar[0] || '';
    el('in-tb2').value = push.titleBar[1] || '';
    el('in-tb3').value = push.titleBar[2] || '';
  }
  if (push.names) el('in-names').value = push.names.join(',');
  if (push.values) el('in-values').value = push.values.join(',');
  if (push.tabs) el('in-tabs').value = push.tabs.join(',');
  if (push.currentValue !== undefined) el('in-current-value').value = push.currentValue;
  if (push.pageLabels) el('in-pagelabels').value = push.pageLabels.join(',');
  if (push.padState) el('in-padstate').value = push.padState.join(',');
  if (push.menuItems) el('in-menuitems').value = push.menuItems.join(',');
  if (push.menuHighlight !== undefined) el('in-menuhighlight').value = push.menuHighlight;
  if (push.message !== undefined) el('in-message-overlay').value = push.message;
  if (push.ledsOn) {
    document.querySelectorAll('.led-dot').forEach(d => {
      d.classList.toggle('on', push.ledsOn.includes(parseInt(d.dataset.cc, 10)));
    });
  }
  renderSimulator();

  // This push is itself a record of what's actually on the device (from this
  // tab's own last send, or another client's) -- fold whatever fields it
  // carries into our diff baseline so pushToDevice() doesn't re-send them as
  // "changed" the next time this tab's own inputs are touched.
  if (push.layout !== undefined) lastSent.layout = push.layout;
  if (push.bigfont !== undefined) lastSent.bigfont = push.bigfont;
  if (push.titleBar) lastSent.titleBar = push.titleBar;
  if (push.names) lastSent.names = push.names;
  if (push.values) lastSent.values = push.values;
  if (push.tabs) lastSent.tabs = push.tabs;
  if (push.currentValue !== undefined) lastSent.currentValue = push.currentValue;
  if (push.pageLabels) lastSent.pageLabels = push.pageLabels;
  if (push.padState) lastSent.padState = push.padState;
  if (push.menuItems) lastSent.menuItems = push.menuItems;
  if (push.menuHighlight !== undefined) lastSent.menuHighlight = push.menuHighlight;
  if (push.message !== undefined) lastSent.message = push.message;
  if (push.ledsOn) lastSent.ledsOn = push.ledsOn;
}

// Purely hot-reload now (mtime check) -- state sync is the WebSocket's job
// (see connectService() above), not this HTTP server's, since server.py has
// no involvement in screen state at all anymore.
async function poll() {
  try {
    const res = await fetch('/state.json', {cache: 'no-store'});
    const state = await res.json();
    if (knownHtmlMtime === null) {
      knownHtmlMtime = state._html_mtime;
    } else if (state._html_mtime !== knownHtmlMtime) {
      location.reload();
      return;
    }
  } catch (e) { /* ignore, retry next tick */ }
  setTimeout(poll, 700);
}
poll();
</script>
</body>
